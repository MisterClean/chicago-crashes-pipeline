# Legacy TOML/settings reference for a private, single-volume bootstrap.
# New Railway services must configure these settings through the UI or IaC.
# After verified seed and backup, use crashes-entrypoint serve and /ready.
[build]
builder = "DOCKERFILE"
dockerfilePath = "docker/Dockerfile.rust"

[deploy]
numReplicas = 1
startCommand = "/usr/local/bin/crashes-bootstrap"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
