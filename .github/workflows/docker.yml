name: Docker
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
jobs:
  docker-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Rust application image
        run: docker build -f docker/Dockerfile.rust -t chicago-crashes-pipeline:test .
      - name: Probe the pinned native engine without source data
        run: docker run --rm --network none -e APP_ENV=development chicago-crashes-pipeline:test probe
      - name: Reject serving an empty data volume
        run: |
          if docker run --rm --network none chicago-crashes-pipeline:test serve; then
            echo 'Empty production startup was incorrectly accepted' >&2
            exit 1
          fi
