# =============================================================================
# Railway Configuration - Chicago Crash Dashboard (Frontend)
# =============================================================================
# Next.js frontend service
# =============================================================================

[build]
builder = "RAILPACK"

[deploy]
# Start command
startCommand = "npm run start"
# Health check
healthcheckPath = "/"
healthcheckTimeout = 100
# Restart policy
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
