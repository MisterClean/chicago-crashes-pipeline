# =============================================================================
# Railway Configuration - Chicago Crash Dashboard (Frontend)
# =============================================================================
# Legacy settings reference; new services use Railway settings or IaC.
# Build with the frontend directory as the service root.
# =============================================================================

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Start command
startCommand = "node server.js"
# Health check
healthcheckPath = "/"
healthcheckTimeout = 100
# Restart policy
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
