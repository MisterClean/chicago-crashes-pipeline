# =============================================================================
# Railway Configuration - Chicago Crash Data Pipeline
# =============================================================================
# This configures the single-owner Rust + DuckDB backend service.
# The frontend is configured separately in frontend/railway.toml
# =============================================================================

[build]
# Build the single-owner Rust runtime.
dockerfilePath = "docker/Dockerfile.rust"

[deploy]
numReplicas = 1
# Railway replaces the image entrypoint; the executable reads PORT itself.
startCommand = "/usr/local/bin/crashes-entrypoint serve"
# Health check endpoint
healthcheckPath = "/ready"
healthcheckTimeout = 100
# Restart policy
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
