[package]
name = "crashes-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
csv = "1"
cron = "0.15"
fs2 = "0.4"
hex = "0.4"
hmac = "0.12"
libloading = "0.9"
libc = "0.2"
percent-encoding = "2"
postgres = { version = "0.19", features = ["with-serde_json-1"] }
postgres-native-tls = "0.5"
native-tls = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
rusty-s3 = { version = "0.10", default-features = false, features = ["rustcrypto", "xml"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
subtle = "2"
tempfile = "3"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "fs", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[build-dependencies]
sha2 = "0.10"
